sonar.projectKey=geraldo-netto_celestial
sonar.organization=geraldo-netto

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=celestial
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.python.version=3.8

# Exclude binding test suites from analysis. These are smoke / contract tests
# that exercise the foreign-function binding surface and don't reflect on
# library quality. Cognitive-complexity findings inside them are noise.
sonar.exclusions=bindings/python/python/celestial_py/tests/**,bindings/js/tests/**,bindings/php/tests/**

# Same exclusion for coverage and duplications.
sonar.coverage.exclusions=bindings/python/python/celestial_py/tests/**,bindings/js/tests/**,bindings/php/tests/**
sonar.cpd.exclusions=bindings/python/python/celestial_py/tests/**,bindings/js/tests/**,bindings/php/tests/**
