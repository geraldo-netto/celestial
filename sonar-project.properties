sonar.projectKey=geraldo-netto_celestial
sonar.organization=geraldo-netto

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=celestial
#sonar.projectVersion=1.0

# Keep production roots explicit so Rust coverage files are indexed as MAIN
# inputs before the LCOV sensor resolves their repository-relative paths.
sonar.sources=core/src,cli/src,bindings/ffi/src,bindings/js,bindings/python,bindings/php,fuzz/src,xtask/src,tests/test-util/src

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.python.version=3.8

# Stub empty bodies, snake_case names, and high arities mirror the published
# contract; syntax and cross-binding parity have dedicated gates.
sonar.exclusions=bindings/php/phpstan-stubs.php

# Keep binding tests analyzed: prior broad exclusions hid weak assertions.
# These four rule/file pairs are deliberate interface or harness contracts.
sonar.issue.ignore.multicriteria=ffiAscii,testHelpers,testExceptions,exactFloats
sonar.issue.ignore.multicriteria.ffiAscii.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.ffiAscii.resourceKey=bindings/js/tests/celestial.test.ts
sonar.issue.ignore.multicriteria.testHelpers.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.testHelpers.resourceKey=bindings/js/tests/pure_logic.test.mjs
sonar.issue.ignore.multicriteria.testExceptions.ruleKey=php:S112
sonar.issue.ignore.multicriteria.testExceptions.resourceKey=bindings/php/tests/binding_golden_test.php
sonar.issue.ignore.multicriteria.exactFloats.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.exactFloats.resourceKey=bindings/python/python/celestial_py/tests/test_celestial_py.py

# Binding tests are also excluded from coverage. `fuzz/` and `xtask/` are dev
# tooling, so excluding them avoids skewing the shipped-library metric. All
# test trees and the static timezone data table are excluded from duplication
# because repeated record shapes there are not actionable code duplication.
sonar.coverage.exclusions=bindings/python/python/celestial_py/tests/**,bindings/js/tests/**,bindings/php/tests/**,fuzz/**,xtask/**
sonar.cpd.exclusions=**/tests/**,core/src/functions/timezone.rs

# Test source paths — SonarCloud uses these to know what NOT to count as
# production code when computing coverage and duplications.
sonar.tests=core/tests,cli/tests,bindings/python/python/celestial_py/tests,bindings/js/tests,bindings/php/tests

# ── Coverage ──────────────────────────────────────────────────────────────────
# Rust workspace coverage is emitted as an lcov report by `cargo llvm-cov`
# in the `celestial-core` CI pipeline (`coverage` job, uploaded as an
# artifact; the SonarQube job downloads it before scanning).
#
# `sonar.rust.lcov.reportPaths` is the property used by the Sonar Rust
# analyzer (SonarCloud, 2024+). Path is relative to this file.
sonar.rust.lcov.reportPaths=lcov.info
