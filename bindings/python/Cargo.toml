[package]
name        = "celestial-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Swiss Ephemeris via PyO3"

[lib]
name      = "_celestial_py"
crate-type = ["cdylib"]

[dependencies]
celestial-core = { path = "../../core", default-features = false }
pyo3          = { workspace = true }

[features]
default = ["timezone", "calendar-traditions"]
timezone = ["celestial-core/timezone"]
calendar-traditions = ["celestial-core/calendar-traditions"]
