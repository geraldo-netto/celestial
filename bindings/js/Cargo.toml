[package]
name        = "celestial-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js/TypeScript bindings for Swiss Ephemeris via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
celestial-core = { path = "../../core", default-features = false }
napi          = { workspace = true }
napi-derive   = { workspace = true }

[build-dependencies]
napi-build = "2"

[features]
default = ["timezone", "calendar-traditions"]
timezone = ["celestial-core/timezone"]
calendar-traditions = ["celestial-core/calendar-traditions"]
