<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580">
  <rect width="700" height="580" fill="#1a0a00"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="600"
        font-family="'Segoe UI',system-ui,sans-serif" fill="#d4a800">Mesoamerican Calendars</text>
  <text x="350" y="46" text-anchor="middle" font-size="9"
        font-family="'Segoe UI',system-ui,sans-serif" fill="#f0e0c0" opacity=".7">1986-05-30 09:00</text>

  <!-- Aztec Tonalpohualli -->
  <rect x="20" y="65" width="310" height="130" rx="6" fill="none" stroke="#d4a800" stroke-width="1.5" opacity=".6"/>
  <text x="175" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#d4a800">Tonalpohualli (Aztec 260-day)</text>
  <text x="175" y="106" text-anchor="middle" font-size="32" font-weight="700"
        fill="#d4a800">12 Ollin</text>
  <text x="175" y="128" text-anchor="middle" font-size="11"
        fill="#f0e0c0" opacity=".8">12-Earthquake</text>
  <text x="175" y="148" text-anchor="middle" font-size="9"
        fill="#f0e0c0" opacity=".5">Day sign #17: Earthquake</text>
  <text x="175" y="164" text-anchor="middle" font-size="8"
        fill="#f0e0c0" opacity=".4">Trecena (week) 12 of 13</text>

  <!-- Aztec Xiuhpohualli -->
  <rect x="370" y="65" width="310" height="130" rx="6" fill="none" stroke="#d4a800" stroke-width="1.5" opacity=".6"/>
  <text x="525" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#d4a800">Xiuhpohualli (Aztec 365-day)</text>
  <text x="525" y="106" text-anchor="middle" font-size="28" font-weight="700"
        fill="#d4a800">Day 8</text>
  <text x="525" y="128" text-anchor="middle" font-size="14"
        fill="#f0e0c0">Tozoztontli</text>
  <text x="525" y="148" text-anchor="middle" font-size="11"
        fill="#f0e0c0" opacity=".7">Small Vigil</text>

  <!-- Calendar Round (52-year cycle) -->
  <rect x="150" y="365" width="400" height="80" rx="6" fill="none" stroke="#d4a800" stroke-width="1.5" opacity=".5"/>
  <text x="350" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#d4a800">Calendar Round (52-year cycle)</text>
  <text x="350" y="406" text-anchor="middle" font-size="18" font-weight="700"
        fill="#d4a800">12 Caban — 10 Sip</text>
  <text x="350" y="426" text-anchor="middle" font-size="8"
        fill="#f0e0c0" opacity=".45">Tzolkin + Haab combination, repeats every 18,980 days (≈52 years)</text>
  <text x="350" y="525" text-anchor="middle" font-size="9" fill="#4a9a6a" opacity=".5">Maya</text>
  <rect x="310" y="516" width="12" height="12" fill="#4a9a6a" opacity=".4" rx="2"/>
  <text x="370" y="525" text-anchor="middle" font-size="9" fill="#d4a800" opacity=".5">Aztec</text>
  <rect x="330" y="516" width="12" height="12" fill="#d4a800" opacity=".4" rx="2"/>
</svg>
