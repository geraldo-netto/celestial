[package]
name        = "celestial-cli"
version.workspace = true
edition     = "2021"
description = "Command-line interface for the celestial astronomical engine"
license     = "AGPL-3.0-or-later"
authors     = ["geraldo-netto"]

[lib]
name = "celestial_cli"
path = "src/lib.rs"

[[bin]]
name = "celestial"
path = "src/main.rs"

[dependencies]
celestial-core = { path = "../core", features = ["default"] }
clap        = { version = "=4.4.18", features = ["derive", "color"] }
tinytemplate = "=1.2.1"
serde        = { version = "=1.0.228", features = ["derive"] }
serde_json   = "=1.0.149"
toml         = "=0.4.10"
