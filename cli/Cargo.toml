[package]
name        = "celestial-cli"
version.workspace = true
edition     = "2021"
description = "Command-line interface for the celestial astronomical engine"
license     = "AGPL-3.0-or-later"
authors     = ["geraldo-netto"]

[lib]
name = "celestial_cli"
path = "src/lib.rs"

[[bin]]
name = "celestial"
path = "src/main.rs"

[dependencies]
celestial-core = { path = "../core", features = ["default"] }
clap        = { version = "=4.4.18", features = ["derive", "color"] }
# Jinja2-style template engine: math, filters, loop.index, real conditionals.
# Used for all `--template` rendering. Replaces the previous `tinytemplate`
# which only supported variable interpolation + simple if/for blocks.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "fuel"] }
serde        = { version = "=1.0.228", features = ["derive"] }
serde_json   = "=1.0.149"
thiserror    = "1"
toml         = "0.8"

[dev-dependencies]
assert_cmd            = "2"
celestial-test-util   = { path = "../tests/test-util" }
predicates            = "3"
