# ─── celestial-core pipeline ──────────────────────────────────────────────────────
#
# Triggers: any change to core/, fuzz/, Cargo.toml, Cargo.lock, rustfmt.toml
# Jobs (parallel):
#   lint    → cargo clippy -D correctness -D suspicious -D perf
#   test    → cargo test --package celestial-core (737 tests)
#   fuzz    → cargo run --manifest-path fuzz/Cargo.toml (53 property suites)

name: celestial-core

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "core/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
  pull_request:
    paths:
      - "core/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"

concurrency:
  group: celestial-core-${{ github.ref }}
  cancel-in-progress: true


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-lint-


      - name: cargo clippy
        run: |
          cargo clippy \
            --package celestial-core \
            -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

  test:
    name: tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-test-

      - name: cargo test
        run: |
          cargo test \
            --package celestial-core \
            -- --test-threads=1

  fuzz:
    name: property tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-fuzz-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-fuzz-

      - name: Run property-test suites
        run: cargo run --manifest-path fuzz/Cargo.toml

  feature-matrix:
    name: feature flags
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        features:
          - ""                           # no-default-features (minimal build)
          - "timezone"                   # timezone only
          - "calendar-traditions"        # calendar only
          - "timezone,calendar-traditions" # full default
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-feat-${{ matrix.features }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-feat-

      - name: cargo check (features = "${{ matrix.features }}")
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --package celestial-core --no-default-features
          else
            cargo check --package celestial-core --no-default-features \
              --features "${{ matrix.features }}"
          fi
