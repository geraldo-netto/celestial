# ─── celestial-core pipeline ──────────────────────────────────────────────────────
#
# Triggers: any change to core/, fuzz/, Cargo.toml, Cargo.lock, rustfmt.toml
# Jobs (parallel):
#   lint    → cargo clippy -D correctness -D suspicious -D perf
#   test    → cargo test --package celestial-core (685 tests)
#   fuzz    → cargo run --manifest-path fuzz/Cargo.toml (53 property suites)
#   coverage → cargo-llvm-cov + Codecov upload

name: celestial-core

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "core/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
  pull_request:
    paths:
      - "core/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"

concurrency:
  group: celestial-core-${{ github.ref }}
  cancel-in-progress: true


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-lint-


      - name: cargo clippy
        run: |
          cargo clippy \
            --package celestial-core \
            -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

  test:
    name: tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-test-

      - name: cargo test
        run: |
          cargo test \
            --package celestial-core \
            -- --test-threads=1

  fuzz:
    name: property tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-fuzz-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-fuzz-

      - name: Run property-test suites
        run: cargo run --manifest-path fuzz/Cargo.toml

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate LCOV coverage report
        run: |
          cargo llvm-cov \
            --package celestial-core \
            --test-threads=1 \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust-core
          name: celestial-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

