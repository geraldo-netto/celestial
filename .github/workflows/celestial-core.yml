# ─── celestial-core pipeline ──────────────────────────────────────────────────────
#
# Triggers: changes to any root-workspace member or shared build configuration
# Jobs:
#   lint           → cargo clippy -D correctness -D suspicious -D perf
#   test           → cargo test --package celestial-core
#   fuzz           → cargo run --manifest-path fuzz/Cargo.toml (84 property suites)
#   coverage       → tests+fuzz merged; lcov upload + product ≥80% line / ≥90% function floor
#   sonarqube      → needs coverage; downloads lcov.info, runs Sonar scan
#   feature-matrix → cargo check across feature flag combinations

name: celestial-core

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "core/**"
      - "bindings/ffi/**"
      - "bindings/python/**"
      - "bindings/js/**"
      - "fuzz/**"
      - "cli/**"
      - "xtask/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/celestial-core.yml"
      - "sonar-project.properties"
  pull_request:
    paths:
      - "core/**"
      - "bindings/ffi/**"
      - "bindings/python/**"
      - "bindings/js/**"
      - "fuzz/**"
      - "cli/**"
      - "xtask/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - ".github/workflows/celestial-core.yml"
      - "sonar-project.properties"

concurrency:
  group: celestial-core-${{ github.ref }}
  cancel-in-progress: true


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:

  coverage:
    name: coverage (lcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-cov-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-cov-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage + enforce product floor (TEST-3)
        # The property harness is a `[[bin]]`, so `cargo llvm-cov
        # --workspace` alone never runs it and understates true
        # coverage. Collect tests + the fuzz harness into one profile,
        # emit the full lcov (SonarCloud filters via
        # sonar-project.properties), then gate on product code only —
        # fuzz/xtask/binding-tests/generated tables are excluded from
        # the floor, not the report.
        #
        # `cargo clean -p <crate>` for every workspace crate before the
        # coverage build. `actions/cache` restores target/ keyed on
        # Cargo.lock; unchanged workspace crates keep their cached
        # *instrumented* binaries from earlier CI runs, which may still
        # contain monomorphizations of fns since deleted (e.g.
        # `eclipses::saros`). Those stale binaries get merged into the
        # next report and inflate the missed-fn count by ~2x. Cleaning
        # only the workspace crates forces a fresh instrumentation pass
        # while keeping the (slow) deps cache. `llvm-cov clean
        # --workspace` alone is insufficient — it leaves debug artifacts
        # intact.
        run: |
          for crate in celestial-core celestial-cli celestial-ffi celestial-py celestial-js celestial-fuzz xtask celestial-test-util; do
            cargo clean -p "$crate" || true
          done
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --workspace
          cargo llvm-cov run --no-report --release \
            --manifest-path fuzz/Cargo.toml --bin run_prop_tests
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 75 \
            --fail-under-functions 78 \
            --ignore-filename-regex '(fuzz/|xtask/|/tests/|bindings/|astronomy/vsop87\.rs)'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-coverage
          path: lcov.info
          retention-days: 7

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [coverage]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: lcov-coverage
          # Sonar reads `lcov.info` from the project root — matches the path
          # in sonar-project.properties (`sonar.rust.lcov.reportPaths`).

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-lint-


      - name: cargo clippy
        run: |
          cargo clippy \
            --package celestial-core \
            -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

  test:
    name: tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-test-

      - name: cargo test
        run: |
          cargo test \
            --package celestial-core \
            -- --test-threads=1

  fuzz:
    name: property tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-fuzz-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-fuzz-

      - name: Run property-test suites
        run: cargo run --manifest-path fuzz/Cargo.toml

  feature-matrix:
    name: feature flags
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        include:
          - id: none
            features: ""                          # no-default-features (minimal build)
          - id: tz
            features: "timezone"                  # timezone only
          - id: cal
            features: "calendar-traditions"       # calendar only
          - id: all
            features: "timezone,calendar-traditions"  # full default
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-feat-${{ matrix.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-feat-

      - name: cargo test (features = "${{ matrix.features }}")
        # Run the suite — not just `check` — under each feature combo so
        # feature-OFF *behavior* is exercised (compile-only checks let the
        # ARCH-7 / 6da2ec9 / WIRE-2 feature-gate bugs through). RUSTFLAGS
        # denies warnings so feature-OFF-only dead imports (TEST-5) fail CI.
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --package celestial-core --no-default-features
          else
            cargo test --package celestial-core --no-default-features \
              --features "${{ matrix.features }}"
          fi
