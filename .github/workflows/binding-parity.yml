# ─── binding parity check ──────────────────────────────────────────────────────
#
# Runs on every PR and push to main that touches any binding source.
# Fails immediately if Python, JS, and PHP don't export the same function set.
# Fix gaps with:  cargo xtask codegen --apply  (then review the diff)

name: binding-parity

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "bindings/**"
      - "core/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/binding-parity.yml"
  pull_request:
    paths:
      - "bindings/**"
      - "core/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/binding-parity.yml"

concurrency:
  group: binding-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: parity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-xtask-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-xtask-

      - name: Check binding parity
        run: |
          cargo xtask parity
          cargo xtask coverage
          cargo xtask shapes --check
          cargo xtask apidoc --check
          cargo xtask test-stubs
          cargo xtask pyi --check
          cargo xtask dts --check

      - name: Validate phpstan-stubs.php syntax
        run: cargo xtask test-stubs

      - name: Show fix suggestions on failure
        if: failure()
        run: |
          echo "──────────────────────────────────────────────────────────────"
          echo "Binding gate failed. Depending on which check tripped:"
          echo ""
          echo "  parity   → cargo xtask codegen --apply   (add missing wrappers)"
          echo "  coverage → bind the new core fn in all 3 languages, OR add it to"
          echo "             xtask/core_unbound_allow.txt (Rust-only) / arity_allow.txt"
          echo "  shapes   → cargo xtask shapes            (a return KIND changed —"
          echo "             update docs/generated + the language guide too)"
          echo "  apidoc   → cargo xtask apidoc            (regenerate the API doc)"
          echo "  pyi/dts  → cargo xtask pyi / dts         (regenerate stubs)"
          echo "  Review every generated diff before committing."
          echo "──────────────────────────────────────────────────────────────"
          cargo xtask codegen || true
