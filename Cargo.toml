[workspace]
members  = ["core", "bindings/ffi", "bindings/python", "bindings/js", "fuzz", "cli", "xtask", "tests/test-util"]
resolver = "2"

[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.82"
license  = "AGPL-3.0-or-later"
authors  = ["geraldo-netto"]

[workspace.dependencies]
pyo3         = { version = "0.24.1", features = ["extension-module"] }
napi         = { version = "2", features = ["napi4"] }
napi-derive  = "2"

# Pin unicode-segmentation to a version compatible with Rust 1.75
[workspace.dependencies.unicode-segmentation]
version = "=1.11.0"

[profile.release]
# Link-time optimisation: enables cross-crate inlining. ~5-15% perf improvement
# for computation-heavy workloads like VSOP87 evaluation. Slows compile by ~2x,
# which is acceptable for release builds.
lto = "thin"
# Single codegen unit lets the optimizer see the whole crate at once.
# Combined with LTO this gives the best runtime performance.
codegen-units = 1
